services:
  wazuh.manager:
    image: wazuh/wazuh-manager:4.14.4
    container_name: wazuh.manager
    hostname: wazuh.manager
    restart: always
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    ports:
      - "1514:1514"
      - "1515:1515"
      - "514:514/udp"
      - "55000:55000"
    environment:
      - INDEXER_URL="https://wazuh.indexer:9200"
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=admin
      - API_PASSWORD=123456##ABCdef
    volumes:
      - ./data_wazuh/wazuh_api_configuration:/var/ossec/api/configuration:z
      - ./data_wazuh/wazuh_etc:/var/ossec/etc:z
      - ./data_wazuh/wazuh_logs:/var/ossec/logs:z
      - ./data_wazuh/wazuh_queue:/var/ossec/queue:z
      - ./data_wazuh/wazuh_var_multigroups:/var/ossec/var/multigroups:z
      - ./data_wazuh/wazuh_integrations:/var/ossec/integrations:z
      - ./data_wazuh/wazuh_active_response:/var/ossec/active-response/bin:z
      - ./data_wazuh/wazuh_agentless:/var/ossec/agentless:z
      - ./data_wazuh/wazuh_wodles:/var/ossec/wodles:z
      - ./data_wazuh/filebeat_etc:/etc/filebeat:z
      - ./data_wazuh/filebeat_var:/var/lib/filebeat:z
      - ./config_wazuh/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem:z
      - ./config_wazuh/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem:z
      - ./config_wazuh/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key:z
      - ./config_wazuh/wazuh_cluster/ossec.conf:/wazuh-config-mount/etc/ossec.conf:z
    networks:
      src-network:
        ipv4_address: 172.100.0.12

  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.14.4
    container_name: wazuh.indexer
    hostname: wazuh.indexer
    restart: always
    ports:
      - "9200:9200"
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ./data_wazuh/wazuh-indexer-data:/var/lib/wazuh-indexer:z
      - ./config_wazuh/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem:z
      - ./config_wazuh/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key:z
      - ./config_wazuh/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem:z
      - ./config_wazuh/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem:z
      - ./config_wazuh/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem:z
      - ./config_wazuh/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml:z
      - ./config_wazuh/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml:z
    networks:
      src-network:
        ipv4_address: 172.100.0.11

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.14.4
    container_name: wazuh.dashboard
    hostname: wazuh.dashboard
    restart: always
    ports:
      - 443:5601
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword
      - WAZUH_API_URL=https://wazuh.manager
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=kibanaserver
      - API_USERNAME=admin
      - API_PASSWORD=123456##ABCdef
    volumes:
      - ./data_wazuh/wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config:z
      - ./data_wazuh/wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom:z
      - ./config_wazuh/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem:z
      - ./config_wazuh/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem:z
      - ./config_wazuh/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem:z
      - ./config_wazuh/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:z
      - ./config_wazuh/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml:z
    depends_on:
      - wazuh.indexer
    links:
      - wazuh.indexer:wazuh.indexer
      - wazuh.manager:wazuh.manager
    networks:
      src-network:
        ipv4_address: 172.100.0.10

  apache2:
    build: ./config_apache2
    container_name: apache2.debian
    hostname: apache2.debian
    restart: always
    ports:
      - "80:80"
    networks:
      src-network:
        ipv4_address: 172.100.0.100
    volumes:
      - ./config_apache2/rsyslog.conf:/etc/rsyslog.d/wazuh.conf:ro,z

networks:
  src-network:
    driver: bridge
    name: src-network
    ipam:
      config:
        - subnet: 172.100.0.0/24
          gateway: 172.100.0.1


